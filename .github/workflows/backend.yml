name: Backend (Python)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betalog
          POSTGRES_PASSWORD: betalog
          POSTGRES_DB: betalog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U betalog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL (same database type as Neon)
        env:
          TEST_DATABASE_URL: postgresql://betalog:betalog@localhost:5432/betalog
        run: pytest -q
