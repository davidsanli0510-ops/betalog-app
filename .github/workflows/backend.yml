name: Backend (Spring Boot)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web app (bundled into the server)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test and package the server
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

      - uses: actions/upload-artifact@v4
        with:
          name: betalog-server
          path: backend/build/libs/betalog-server.jar

      - name: Publish the server jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-1.0.${{ github.run_number }}
          name: 베타로그 서버 1.0.${{ github.run_number }}
          files: backend/build/libs/betalog-server.jar
          make_latest: false
          body: |
            PC에서 실행하는 동기화 서버예요. Java 17 이상이 필요해요.
            ```
            java -jar betalog-server.jar
            ```
            실행 방법은 저장소 README의 "서버 실행"을 보세요.
