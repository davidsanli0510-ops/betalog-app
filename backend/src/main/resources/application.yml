server:
  port: ${PORT:8080}
  # listen on every network interface so phones on the same Wi-Fi can reach the PC
  address: 0.0.0.0

spring:
  application:
    name: betalog-server
  datasource:
    # default: a file database next to the server (./data). Set DB_URL etc. to use PostgreSQL later.
    url: ${DB_URL:jdbc:h2:file:./data/betalog;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

betalog:
  # leave empty to auto-generate one and keep it in ./data/jwt.key
  jwt-secret: ${JWT_SECRET:}
  jwt-days: 60
  data-dir: ${DATA_DIR:./data}
  cors-origins: ${CORS_ORIGINS:*}
